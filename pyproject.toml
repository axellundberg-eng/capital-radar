[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capital-radar"
version = "0.1.0"
description = "Källspårbar screener, runway och transaktionsflöde för svenska small caps."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2,<3",
    "pypdf>=5.0,<7",
    "pdfplumber>=0.11,<1",
    "openai>=1.0,<2",
    "instructor>=1.3,<2",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
# src/ = ny kod. legacy/src/ = gammal kod som körs tills den ersatts och sedan raderas.
where = ["src", "legacy/src"]

[tool.setuptools.package-data]
capital_radar = ["schema.sql", "web/*"]

[tool.pytest.ini_options]
# Bara ny kod. Gamla tester körs med: pytest -c legacy/pytest.ini
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
