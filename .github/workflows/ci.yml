name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend tests
        run: node --test tests/js/workspace_loading.test.js tests/js/admin_auth.test.js

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          mkdir -p data
          python3 -c "import sqlite3; sqlite3.connect('data/screener.db').execute('PRAGMA journal_mode=WAL')"
          sudo chown -R 1000:1000 data
          docker run -d --name smoke -p 8000:8000 -v "$PWD/data:/data" ghcr.io/${{ github.repository }}:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then
              curl -fsS -o /dev/null http://127.0.0.1:8000/
              curl -fsS -o /dev/null http://127.0.0.1:8000/workspace.js
              exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1

  deploy:
    needs: image
    # Aktiveras när repo-variabeln DEPLOY_HOST är satt (Settings → Variables).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: SSH-nyckel och känd värd
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Kopiera compose-filer
        run: |
          scp -i ~/.ssh/deploy -o ConnectTimeout=20 \
            docker-compose.yml deploy@${{ vars.DEPLOY_HOST }}:/srv/capital-radar/docker-compose.yml
          scp -i ~/.ssh/deploy -o ConnectTimeout=20 \
            deploy/litestream.yml deploy/remote-deploy.sh deploy/restore-db.sh \
            deploy@${{ vars.DEPLOY_HOST }}:/srv/capital-radar/deploy/
      - name: Driftsätt ${{ github.sha }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy -o ConnectTimeout=20 deploy@${{ vars.DEPLOY_HOST }} \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin" <<< "$GHCR_TOKEN"
          status=0
          ssh -i ~/.ssh/deploy -o ConnectTimeout=20 deploy@${{ vars.DEPLOY_HOST }} \
            "timeout 170 bash /srv/capital-radar/deploy/remote-deploy.sh ${{ github.sha }}" || status=$?
          ssh -i ~/.ssh/deploy -o ConnectTimeout=20 deploy@${{ vars.DEPLOY_HOST }} "docker logout ghcr.io" || true
          exit $status
