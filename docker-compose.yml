# Drift på Hetzner. Starta grundtjänsterna:   docker compose up -d
# Med backup (kräver S3-uppgifter i .env):    docker compose --profile backup up -d
# Publik via Cloudflare (kräver tunnel-token): docker compose --profile public up -d
#
# Webben lyssnar bara på 127.0.0.1:8001 på servern; Cloudflare Tunnel pekar hit.
# Innan Cloudflare är klart:  ssh -L 8001:127.0.0.1:8001 deploy@<server>  och öppna
# http://127.0.0.1:8001/v2/

services:
  radar:
    # Webbgränssnitt och API under /v2 (/ skickar vidare dit). Cloudflare-routen pekar hit.
    image: ghcr.io/${GITHUB_REPOSITORY:-axellundberg-eng/capital-radar}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "radar", "serve"]
    env_file: .env
    environment:
      - RADAR_BASE_PATH=/v2
      - RADAR_PORT=8001
    volumes:
      - /srv/capital-radar/data:/data
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/v2/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  radar-worker:
    # Ny kärna, steg 6: importerar, extraherar och läser nyheter en gång i timmen.
    image: ghcr.io/${GITHUB_REPOSITORY:-axellundberg-eng/capital-radar}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "radar", "schedule"]
    env_file: .env
    volumes:
      - /srv/capital-radar/data:/data
    healthcheck:
      disable: true  # ingen webbserver; driften syns i loggen och i company_status

  litestream:
    profiles: ["backup"]
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    command: replicate
    env_file: .env
    volumes:
      - /srv/capital-radar/data:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    depends_on:
      - radar

  cloudflared:
    profiles: ["public"]
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - radar
