# Drift på Hetzner. Starta grundtjänsten:   docker compose up -d
# Med backup (kräver S3-uppgifter i .env):  docker compose --profile backup up -d
# Publik via Cloudflare (kräver tunnel-token): docker compose --profile public up -d
#
# Appen lyssnar bara på 127.0.0.1 på servern. Innan Cloudflare är klart nås den
# via SSH-tunnel:  ssh -L 8000:127.0.0.1:8000 deploy@<server>

services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-axellundberg-eng/capital-radar}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      - /srv/capital-radar/data:/data
    ports:
      - "127.0.0.1:8000:8000"

  radar:
    # Ny kärna: webbgränssnitt under /v2 (Cloudflare-routen pekar hit).
    image: ghcr.io/${GITHUB_REPOSITORY:-axellundberg-eng/capital-radar}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "radar", "serve"]
    env_file: .env
    environment:
      - RADAR_BASE_PATH=/v2
      - RADAR_PORT=8001
    volumes:
      - /srv/capital-radar/data:/data
    ports:
      - "127.0.0.1:8001:8001"

  radar-worker:
    # Ny kärna, steg 6: importerar, extraherar och läser nyheter en gång i timmen.
    image: ghcr.io/${GITHUB_REPOSITORY:-axellundberg-eng/capital-radar}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "radar", "schedule"]
    env_file: .env
    volumes:
      - /srv/capital-radar/data:/data

  litestream:
    profiles: ["backup"]
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    command: replicate
    env_file: .env
    volumes:
      - /srv/capital-radar/data:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    depends_on:
      - app

  cloudflared:
    profiles: ["public"]
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
